# Subtitle sizing
= add sub-font-size +1
- add sub-font-size -1

# Mouse controls
WHEEL_UP      add volume 5
WHEEL_DOWN    add volume -5
MBTN_LEFT     cycle pause
MBTN_RIGHT    ignore
MBTN_LEFT_DBL cycle fullscreen

# Intuitive arrow key volume control
UP    add volume 5
DOWN  add volume -5

# Home row navigation 
k add volume 5
j add volume -5
h seek -5
l seek 5

# Playback speed
[ add speed -0.1
] add speed 0.1
{ add speed -0.05
} add speed 0.05
