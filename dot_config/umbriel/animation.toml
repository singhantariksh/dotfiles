# Reference: https://docs.noctalia.dev/umbriel/animation/

[animation.beziers]
wind = [0.05, 0.9, 0.1, 1.05]
winIn = [0.1, 1.1, 0.1, 1.1]
winOut = [0.3, -0.3, 0.0, 1.0]
linear = [1.0, 1.0, 1.0, 1.0]

[animation]
enabled = true
duration_ms = 220
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 260
curve = "winOut"
style = "popin"

[animation.windows_out]
enabled = true
duration_ms = 180
curve = "winOut"
style = "slide"

[animation.windows_move]
enabled = true
duration_ms = 280
curve = "wind"

[animation.workspaces]
enabled = true
duration_ms = 300
curve = "wind"

[animation.overview]
enabled = true
duration_ms = 260
curve = "easeout"

[animation.scratchpad]
enabled = true
duration_ms = 280
curve = "wind"
dim = 0.3
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = true
duration_ms = 220
curve = "linear"

[animation.dim_unfocused]
enabled = false
duration_ms = 220
curve = "easeout"
dim = 0.0
