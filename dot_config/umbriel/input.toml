# Input ----------------------------------------------------------------------

[input]
middle_click_paste = false # primary-selection clipboard, applies on reload

[input.keyboard]
layout = "us,us"                     # "us,de" loads both; switch with keyboard-layout-next
variant = ",colemak_dh_ortho"
options = "compose:ralt,caps:escape" # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 25                     # 0-1000 Hz
repeat_delay = 600                   # 0-10000 ms
numlock_toggle = true                # true enables NumLock when a keyboard connects; false leaves it off

[input.touchpad]
tap = true                 # enabled by default; false disables tap-to-click
natural_scroll = true
accel_profile = "adaptive" # "flat", "adaptive", or "custom <step> <points...>"
sensitivity = 0.2          # pointer speed, -1.0 to 1.0
disable_while_typing = true
disable_on_external_mouse = true

[input.mouse]
natural_scroll = false
accel_profile = "flat" # omitted preserves the device's libinput default
sensitivity = -0.2     # pointer speed, -1.0 to 1.0
scroll_wheel_step = 60 # 1-1000

[input.tablet]
enabled = true # false disables the tablet and its pads

[input.cursor]
theme = "ArcDusk-cursors"
size = 24                 # 1-512
hardware_cursor = true    # false forces software cursor composition
hide_when_typing = true   # hide after typing unless a pointer button is held
hide_timeout_ms = 3000    # 0-3600000, 0 disables hiding

[input.focus]
follows_mouse = false
