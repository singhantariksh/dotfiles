# Colors ---------------------------------------------------------------------

[colors]
background = "#1a1b26F0"
text_primary = "#c0caf5FF"
text_muted = "#565f89FF"
accent_primary = "#7aa2f7FF"
accent_secondary = "#eecf66FF"
warning = "#eecf66FF"
error = "#f7768eFF"
insert_hint = "#7dcfff80"
backdrop = "#1a1b26ff"
shadow = "#16161e7f"

[colors.border]
focused = "#7aa2f7ff"
unfocused = "#414868ff"
scratchpad_focused = "#eecf66ff"
scratchpad_unfocused = "#565f89ff"
outer = "#16161eff"

[colors.overview]
background_tint = "#1a1b26cc"
workspace_background = "#1a1b264d"
badge = "#7aa2f7ff"

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 3       # 0-100
outer_border_width = 0 # 0-100
corner_radius = 14     # 0-100
drag_opacity = 0.75

[appearance.blur]
enabled = false
optimized = true
passes = 3       # 0-8
radius = 3       # 0-100
noise = 0.02     # 0.0-1.0
brightness = 0.9 # 0.0-2.0
contrast = 0.9   # 0.0-2.0
saturation = 1.1 # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 15       # 0-200, 0 = hard edge
offset_x = 0        # -200 to 200
offset_y = 3
